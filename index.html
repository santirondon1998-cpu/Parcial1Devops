<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Proyecto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Simulador de Proyecto</h1>
    
    <form id="project-form">
      <div class="form-group">
        <label for="name">Nombre del Proyecto:</label>
        <input type="text" id="name" required placeholder="Ej. Sitio Web Corporativo">
      </div>

      <div class="form-group">
        <label for="budget">Presupuesto ($):</label>
        <input type="number" id="budget" required min="1" placeholder="Ej. 5000">
      </div>

      <div class="form-group">
        <label for="days">Duración estimada (días):</label>
        <input type="number" id="days" required min="1" placeholder="Ej. 30">
      </div>

      <button type="submit">Crear Simulación</button>
    </form>

    <div id="dashboard" class="dashboard hidden">
      <h2 id="project-title"></h2>
      
      <div class="metrics">
        <div class="card">
          <h3>Presupuesto</h3>
          <p id="display-budget">$0</p>
        </div>
        <div class="card">
          <h3>Días Totales</h3>
          <p id="display-days">0</p>
        </div>
      </div>

      <div class="progress-section">
        <label>Progreso de la simulación:</label>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text">0%</span>
      </div>

      <div class="actions">
        <button id="btn-advance">Avanzar 25%</button>
        <button id="btn-reset" class="secondary">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
